<div class="empty-state">
  <ui5-icon name="{{ icon() }}" class="empty-state__icon"></ui5-icon>
  <h3 class="empty-state__title">{{ title() }}</h3>
  @if (message()) {
    <p class="empty-state__message">{{ message() }}</p>
  }
  @if (actionLabel() && actionRoute()) {
    <ui5-button design="Emphasized" [routerLink]="actionRoute()" class="empty-state__action">
      {{ actionLabel() }}
    </ui5-button>
  }
</div>
